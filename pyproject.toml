[project]
name = "cubecoach"
version = "0.1.0"
description = "카메라로 3x3x3 큐브를 읽고 수준별 공식을 음성으로 안내하는 코치"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
